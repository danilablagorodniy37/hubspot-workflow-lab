[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hslab"
version = "0.1.0"
description = "HubSpot workflow lab: take over inherited automations, map them, reproduce and fix a follow-up bug, test it with scripted scenarios."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Daniel Blago" }]
keywords = ["hubspot", "workflows", "automation", "crm", "testing", "n8n"]
dependencies = [
  "httpx>=0.27",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hslab = "hslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
